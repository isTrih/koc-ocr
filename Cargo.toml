[package]
name = "koc-ocr-cli"
version = "2.1.1"
edition = "2024"
description = "KOC 抖音 OCR CLI"
authors = ["Lilith@HUAHaohui"]

[lib]
name = "whwjm_ocr"

[package.metadata.bundle]
name = "KOC OCR CLI"
identifier = "kococr.huahaohui.lilith"
icon = ["ocr-logo.png"]

[features]
default = []
slint-gui = ["dep:rfd", "dep:slint", "dep:webbrowser"]

[[bin]]
name = "koc-ocr-cli"
path = "src/main.rs"

[[bin]]
name = "export_gui"
path = "src/bin/export_gui.rs"
required-features = ["slint-gui"]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
image = "0.25"
ocr-rs = "2.3.x"
rfd = { version = "0.17.2", optional = true }
slint = { version = "1.16.1", optional = true }
ureq = "3.3"
webbrowser = { version = "1.2", optional = true }
