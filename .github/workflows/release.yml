name: Release CLI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            artifact: koc-ocr-cli-macos-arm64
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: koc-ocr-cli-windows-x64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Build CLI
        run: cargo build --release --locked --bin koc-ocr-cli --target ${{ matrix.platform.target }}

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp "target/${{ matrix.platform.target }}/release/koc-ocr-cli.exe" "dist/${{ matrix.platform.artifact }}"
          else
            cp "target/${{ matrix.platform.target }}/release/koc-ocr-cli" "dist/${{ matrix.platform.artifact }}"
            chmod +x "dist/${{ matrix.platform.artifact }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.name }}
          path: dist/${{ matrix.platform.artifact }}

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          body: |
            KOC OCR CLI 二进制版本。

            使用 `koc-ocr-cli init --model medium` 初始化模型。
            使用 `koc-ocr-cli export <图片目录> --type live` 或 `--type video` 导出表格。
